name: Set up job-alert inbox

# Run once by hand (Actions → Set up job-alert inbox → Run workflow) after the DNS and the Supabase
# function are in place (docs/SETUP.md, "Job-alert inbox"). Tells Brevo to hand every email sent to
# the alerts subdomain to the "inbound-email" Supabase function. Brevo only offers this through its API.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: The alerts subdomain (its MX records point at Brevo)
        default: alerts.joshpetersel.com

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create Brevo's inbound webhook
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DOMAIN: ${{ inputs.domain }}
          URL: https://hzeciyeirloyzqkjvvln.supabase.co/functions/v1/inbound-email
        run: |
          body=$(jq -n --arg url "$URL" --arg domain "$DOMAIN" \
            '{type: "inbound", events: ["inboundEmailProcessed"], url: $url, domain: $domain, description: "JobSnipe job-alert inbox"}')
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST https://api.brevo.com/v3/webhooks \
            -H "api-key: $BREVO_API_KEY" -H 'content-type: application/json' -H 'accept: application/json' -d "$body")
          echo "Brevo answered $status"
          # The response has only the new webhook's id (or an error message), nothing secret.
          cat response.json; echo
          if [ "$status" -ge 300 ]; then
            echo "::error::Brevo refused. If it says the key isn't allowed, the API key needs webhook access (see docs/SETUP.md)."
            exit 1
          fi
